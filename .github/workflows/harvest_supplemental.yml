name: harvest-supplemental

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/harvest_supplemental.py'
      - '.github/workflows/harvest_supplemental.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4 lxml pandas xlrd openpyxl
      - name: Harvest supplemental official sources
        run: python .github/scripts/harvest_supplemental.py
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supplemental-census-harvest
          path: supplemental_out/
          if-no-files-found: error
          retention-days: 7
