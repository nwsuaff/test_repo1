name: harvest-local-census

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/harvest_local_census.py'
      - '.github/workflows/harvest_local_census.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install parser dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4 lxml pandas openpyxl xlrd
      - name: Download and parse public local census lists
        run: python .github/scripts/harvest_local_census.py
      - name: Upload harvest artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-census-harvest
          path: local_out/
          if-no-files-found: error
          retention-days: 7
